<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Butori Serafino – Gestione rete vendita</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F1F4F5;--panel:#fff;--ink:#242021;--mute:#5E6A6E;--line:#DAE1E3;--acc:#4C6971;--acc2:#A9BDC3;--accink:#fff;--ok:#1E7B55;--warn:#A86400;--bad:#B3372E;--soft:#F6F8F8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{padding:22px 14px;border-right:1px solid var(--line);background:var(--panel)}
.brand{padding:2px 10px 18px}.brand img{display:block;width:100%;max-width:178px;height:auto}
.nt{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;margin-bottom:22px}
.nt.wait{border-left-color:var(--warn)}.nt.late{border-left-color:var(--bad)}
.nth{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px}
.nth svg{flex:none}.ntt{flex:1 1 220px}
.nth select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.nth label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.ntb{border-top:1px solid var(--line);overflow-x:auto}.ntb table{min-width:680px}
.btn.sm{padding:5px 10px;font-size:13px}
td.act{white-space:nowrap}td.act .btn{margin-right:4px}
.ntb tr.lt td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:0 18px}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.stk{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:6px 0 12px;background:var(--soft)}.stk i{display:block;height:100%}
.sc{overflow-x:auto}.cht{display:block;width:100%;min-width:600px;height:auto}.cht text{fill:var(--mute);font-size:11px}
.bar label.sub{display:flex;align-items:center;gap:6px}
.sig{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;margin-bottom:2px;cursor:pointer;color:var(--mute);font-weight:500}
nav button[aria-current=page]{background:var(--soft);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
nav .bk{margin-top:18px;border-top:1px solid var(--line);border-radius:0;padding-top:14px}
main{padding:26px clamp(14px,3vw,36px);min-width:0;max-width:1100px}
main>h2{font-size:26px;margin-bottom:16px}
.strip{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:22px}
.strip div{flex:1 1 150px;padding:14px 18px;border-right:1px solid var(--line)}
.strip div:last-child{border-right:0}
.strip b{display:block;font:700 24px "Bricolage Grotesque",sans-serif}
.strip span{color:var(--mute);font-size:13px}
section.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:22px}
section.box h3{font-size:17px;margin-bottom:12px}
.rank{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;padding:7px 0}
.track{height:16px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--acc);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .5s}}
.rank small{color:var(--mute)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
.bar input[type=search]{flex:1 1 200px}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.del{background:none;color:var(--bad);border:1px solid var(--bad)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.tag:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-attivo{color:var(--ok)}.s-trattativa{color:var(--warn)}.s-lead{color:var(--acc)}.s-perso,.s-inattivo{color:var(--mute)}
.empty{padding:28px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(600px,calc(100% - 24px));padding:0}
dialog::backdrop{background:rgba(10,16,30,.55)}
.dh{padding:18px 20px 6px}.db{padding:8px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.db label{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.db label.w{grid-column:1/-1}
.db input,.db select,.db textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.df{padding:14px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.df .l{margin-right:auto}
.mini{grid-column:1/-1;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.mini div{display:flex;justify-content:space-between;padding:3px 0}
  .db label.ck{display:flex;gap:8px;align-items:center}.db label.ck input{width:auto;margin:0}
.mini p{margin:4px 0}
.lines{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.ln{display:grid;grid-template-columns:minmax(0,2fr) .9fr .6fr .7fr .9fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.ln.hd{font-size:13px;color:var(--mute);font-weight:500;margin-bottom:4px}
.db .ln input{margin:0}
.ln output{display:block;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ln .x,.dn .x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:20px;line-height:1;padding:4px 8px}
.tot{display:flex;justify-content:flex-end;gap:12px;font:700 20px "Bricolage Grotesque",sans-serif;padding:6px 0}
.nc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.dn{display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.dn.hd{font-size:13px;color:var(--mute);font-weight:500;margin-bottom:4px}
.db .dn input{margin:0}
@media (max-width:760px){.dn{grid-template-columns:1fr 1fr}.dn.hd{display:none}.dn>:first-child{grid-column:1/-1}.ln{grid-template-columns:1fr 1fr}.ln.hd{display:none}.ln>:first-child{grid-column:1/-1}}
textarea.bkp{min-height:220px;font:13px/1.4 ui-monospace,Menlo,monospace}
@media (max-width:760px){
.app{grid-template-columns:1fr}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}
.brand{padding:0 10px 0 4px;flex:none;align-self:center}.brand img{height:30px;width:auto;max-width:none}nav button{width:auto;white-space:nowrap;margin:0}
nav button[aria-current=page]{box-shadow:inset 0 -3px 0 var(--acc)}
nav .bk{margin:0;border:0;padding:9px 10px}
.db{grid-template-columns:1fr}.rank{grid-template-columns:90px 1fr auto}
.strip div{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>

<main id="main"></main>
</div>
<dialog id="dlg"></dialog>

const SIG='<footer class="sig">Software ideato e creato da <b>Federico Gambina</b></footer>';
const KEY='rete-vendita-v2';
const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const dt=d=>d?new Date(d).toLocaleDateString('it-IT'):'–';
const uid=p=>p+Math.random().toString(36).slice(2,8);
const ST={lead:'Lead',trattativa:'In trattativa',attivo:'Attivo',perso:'Perso'};
const sample=()=>({agents:[],clients:[],docs:[],products:[]});
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.agents)&&Array.isArray(o.clients)){o.docs=Array.isArray(o.docs)?o.docs:[];o.products=Array.isArray(o.products)?o.products:[];return o}}}catch(e){}return sample()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}fsQueue()}
let S=load(),view='dash',q='',fa='',fs='';
const ag=id=>S.agents.find(a=>a.id===id);
function stats(a){const cs=S.clients.filter(c=>c.agentId===a.id);const rev=cs.filter(c=>c.status==='attivo').reduce((t,c)=>t+(+c.revenue||0),0)+S.docs.filter(d=>d.type==='ordine'&&d.status!=='annullato'&&d.agentId===a.id).reduce((t,d)=>t+docTot(d),0);return{n:cs.length,act:cs.filter(c=>c.status==='attivo').length,rev,com:rev*(+a.rate||0)/100}}
const tag=(s,l)=>`<span class="tag s-${s}">${h(l||ST[s]||s)}</span>`;
const match=(t)=>t.toLowerCase().includes(q.toLowerCase());

function renderNav(){
const items=[['dash','Panoramica'],['agents','Agenti'],['clients','Clienti'],['prod','Prodotti'],['docs','Preventivi e ordini'],['comm','Provvigioni'],['report','Report'],['arch','Archivi']];
$('#nav').innerHTML='<div class="brand"><img src="'+LOGO+'" alt="Butori Serafino – Soluzioni per l\'energia"></div>'+items.map(([k,l])=>`<button ${view===k?'aria-current="page"':''} onclick="go('${k}')">${k==='arch'&&DIR&&!fsOk?l+' ⚠':k==='docs'&&pend().late?l+' · '+pend().late:l}</button>`).join('')+'<button class="bk" onclick="openImport()">Importa Excel</button><button onclick="openBackup()">Backup dati</button>'}
function go(v){view=v;q='';fa='';fs='';render()}

function dash(){
const all=S.agents.map(a=>({a,s:stats(a)})).sort((x,y)=>y.s.rev-x.s.rev);
const tot=all.reduce((t,x)=>t+x.s.rev,0),com=all.reduce((t,x)=>t+x.s.com,0),max=Math.max(1,...all.map(x=>x.s.rev));
const last=[...S.clients].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
return `<h2>Panoramica</h2>
${!S.agents.length&&!S.clients.length?'<section class="box"><h3>Nessun dato presente</h3><p class="sub">Importa un file Excel oppure inserisci il primo agente.</p><div class="bar"><button class="btn" onclick="openImport()">Importa da Excel</button><button class="btn alt" onclick="openA()">Nuovo agente</button></div></section>':''}
<div class="strip"><div><b>${S.agents.filter(a=>a.status==='attivo').length}</b><span>agenti attivi</span></div>
<div><b>${S.clients.length}</b><span>clienti portati dagli agenti</span></div>
<div><b>${S.clients.filter(c=>c.status==='attivo').length}</b><span>clienti attivi</span></div>
<div><b>${eur(tot)}</b><span>fatturato clienti attivi</span></div>
<div><b>${eur(com)}</b><span>provvigioni maturate</span></div></div>
<section class="box"><h3>Fatturato per agente</h3>${all.length?all.map(({a,s})=>`<div class="rank"><span>${h(a.name)}<br><small>${s.act} clienti attivi</small></span><div class="track"><i style="width:${s.rev/max*100}%"></i></div><b>${eur(s.rev)}</b></div>`).join(''):'<div class="empty">Nessun agente: aggiungine uno dalla sezione Agenti.</div>'}</section>
<section class="box"><h3>Ultimi clienti acquisiti</h3>${last.length?`<div class="tw" style="border:0"><table><tbody>${last.map(c=>`<tr data-open onclick="openC('${c.id}')"><td>${h(c.company)}<br><span class="sub">${h(c.contact)}</span></td><td>${h(ag(c.agentId)?.name||'Senza agente')}</td><td>${dt(c.date)}</td><td>${tag(c.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nessun cliente inserito.</div>'}</section>`}

function agRows(){
const l=S.agents.filter(a=>match(a.name+' '+a.zone));
return l.length?l.map(a=>{const s=stats(a);return `<tr data-open onclick="openA('${a.id}')"><td>${h(a.name)}<br><span class="sub">${h(a.email)}</span></td><td>${h(a.zone)}</td><td class="n">${s.n}</td><td class="n">${eur(s.rev)}</td><td class="n">${a.rate}%</td><td>${tag(a.status,a.status==='attivo'?'Attivo':'Inattivo')}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Nessun agente trovato. Usa "Nuovo agente" per aggiungerne uno.</td></tr>'}
function agents(){return `<h2>Agenti</h2><div class="bar"><input type="search" placeholder="Cerca per nome o zona" oninput="q=this.value;$('#rows').innerHTML=agRows()"><button class="btn alt" onclick="openImport('agents')">Importa agenti da Excel</button><button class="btn" onclick="openA()">Nuovo agente</button></div>

const l=S.clients.filter(c=>match(c.company+' '+c.contact)&&(!fa||(fa==='-'?!ag(c.agentId):c.agentId===fa))&&(!fs||c.status===fs));
return l.length?l.map(c=>`<tr data-open onclick="openC('${c.id}')"><td>${h(c.company)}<br><span class="sub">${h(c.contact)}</span></td><td>${h(ag(c.agentId)?.name||'Senza agente')}</td><td>${dt(c.date)}</td><td>${tag(c.status)}</td><td class="n">${eur(clientRev(c))}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nessun cliente corrisponde ai filtri.</td></tr>'}
function clients(){return `<h2>Clienti</h2><div class="bar"><input type="search" placeholder="Cerca azienda o referente" oninput="q=this.value;$('#rows').innerHTML=clRows()">
<select aria-label="Filtra per agente" onchange="fa=this.value;$('#rows').innerHTML=clRows()"><option value="">Tutti gli agenti</option>${S.agents.map(a=>`<option value="${a.id}">${h(a.name)}</option>`).join('')}<option value="-">Senza agente</option></select>

function comm(){
const all=S.agents.map(a=>({a,s:stats(a)}));const T=all.reduce((t,x)=>({r:t.r+x.s.rev,c:t.c+x.s.com}),{r:0,c:0});

${all.map(({a,s})=>`<tr><td>${h(a.name)}</td><td class="n">${s.act}</td><td class="n">${eur(s.rev)}</td><td class="n">${a.rate}%</td><td class="n"><b>${eur(s.com)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nessun agente inserito.</td></tr>'}
<tr><td><b>Totale</b></td><td></td><td class="n"><b>${eur(T.r)}</b></td><td></td><td class="n"><b>${eur(T.c)}</b></td></tr></tbody></table></div>

function openBackup(){
dlg('Backup dati',`<label class="w">Copia questo testo e conservalo: per ripristinare i dati, incollalo qui e usa "Importa". I dati sono salvati solo in questo browser.<textarea id="f_bk" class="bkp" spellcheck="false"></textarea></label><div class="mini sub" id="bkmsg">Scegli un'azione.</div>`,

let rst=0;function resetD(){if(!rst){rst=1;$('#rstb').textContent='Conferma: cancella tutto';return}rst=0;S=sample();save();closeDlg();render()}
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const num=v=>{if(typeof v==='number')return v;let s=String(v==null?'':v).replace(/[€%\s]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n};
const isoD=v=>{if(v===''||v==null)return '';if(typeof v==='number'&&v>20000){const p=XLSX.SSF.parse_date_code(v);return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:''}const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=s.match(/^\d{4}-\d{2}-\d{2}/);return m?m[0]:''};
const rowsOf=ws=>XLSX.utils.sheet_to_json(ws,{defval:'',raw:true}).map(r=>{const o={};for(const k in r)o[norm(k)]=r[k];return o});
const pick=(r,keys)=>{for(const k of keys)if(r[k]!==undefined&&String(r[k]).trim()!=='')return r[k];return ''};
const txt=(r,keys)=>String(pick(r,keys)).trim();
const imsg=t=>$('#imsg').textContent=t;
let impMode='';
function openImport(m){impMode=m||'';
const I={agents:'<p>Colonne: Nome, Email, Telefono, Zona, Provvigione, Stato (Attivo o Inattivo). Viene letto il foglio "Agenti", oppure il primo foglio del file.</p>',products:'<p>Colonne: Codice, Prodotto, Categoria, UM, Prezzo, Stato (Attivo o Non attivo), Sconti (facoltativa, ad esempio 10:5; 50:10+5 significa da 10 pezzi 5%, da 50 pezzi 10% più 5%). Viene letto il foglio "Prodotti", oppure il primo foglio del file. Un prodotto con lo stesso codice (o lo stesso nome, se manca il codice) viene aggiornato.</p>',clients:'<p>Colonne: Azienda, Referente, Email, Telefono, Agente, Data, Stato, Fatturato, Note. Viene letto il foglio "Clienti", oppure il primo foglio del file.</p><p>Ogni cliente è collegato all\'agente con lo stesso nome; se non esiste, viene creato con provvigione 0%. Stati: Lead, In trattativa, Attivo, Perso.</p>'}[impMode]||'<p>Foglio "Clienti": Azienda, Referente, Email, Telefono, Agente, Data, Stato, Fatturato, Note.</p><p>Foglio "Agenti" (facoltativo): Nome, Email, Telefono, Zona, Provvigione, Stato.</p><p>Foglio "Prodotti" (facoltativo): Codice, Prodotto, Categoria, UM, Prezzo, Stato, Sconti.</p><p>Con un solo foglio, il file viene letto come elenco clienti. Ogni cliente è collegato all\'agente con lo stesso nome; se non esiste, viene creato con provvigione 0%. Stati: Lead, In trattativa, Attivo, Perso.</p>';
dlg({agents:'Importa agenti da Excel',clients:'Importa clienti da Excel',products:'Importa prodotti da Excel'}[impMode]||'Importa clienti e agenti da Excel',`<label class="w">File Excel (.xlsx, .xls) o CSV<input id="f_file" type="file" accept=".xlsx,.xls,.csv"></label>
<label class="w ck"><input id="f_rep" type="checkbox"> Sostituisci i dati esistenti dello stesso tipo (altrimenti si aggiungono)</label>
<div class="mini sub"><b>Come preparare il file</b>${I}</div>
<div class="mini" id="imsg">Scegli un file e premi "Importa".</div>`,
'<button class="btn alt" onclick="closeDlg()">Chiudi</button><button class="btn" onclick="doImport()">Importa</button>')}
function doImport(){
const f=$('#f_file').files[0];if(!f){imsg('Scegli prima un file.');return}
if(typeof XLSX==='undefined'){imsg('La libreria Excel non si è caricata: controlla la connessione e ricarica la pagina.');return}
const rd=new FileReader();
rd.onload=()=>{try{
const wb=XLSX.read(rd.result,{type:'array'});
const find=n=>wb.SheetNames.find(x=>norm(x)===n);
let sp=find('prodotti'),sa=find('agenti'),sc=find('clienti')||((sa||sp)?null:wb.SheetNames[0]);
if(impMode==='agents'){sa=sa||wb.SheetNames[0];sc=sp=null}else if(impMode==='clients'){sc=find('clienti')||wb.SheetNames[0];sa=sp=null}else if(impMode==='products'){sp=sp||wb.SheetNames[0];sa=sc=null}
const rp=$('#f_rep').checked;
const next={agents:rp&&sa?[]:[...S.agents],clients:rp&&sc?[]:[...S.clients],docs:S.docs,products:rp&&sp?[]:[...S.products]};
let na=0,nc=0,np=0;
const byName=n=>next.agents.find(a=>norm(a.name)===norm(n));
if(sa)rowsOf(wb.Sheets[sa]).forEach(r=>{const name=txt(r,['nome','nomecognome','nomeecognome','agente']);if(!name)return;
let rate=num(pick(r,['provvigione','percentuale','provv']));if(rate>0&&rate<1)rate*=100;
const d={name,email:txt(r,['email','mail']),phone:txt(r,['telefono','tel','cellulare']),zone:txt(r,['zona','area','territorio']),rate:Math.round(rate*100)/100,status:/inattiv/.test(norm(pick(r,['stato'])))?'inattivo':'attivo'};
const e=byName(name);if(e)Object.assign(e,d);else next.agents.push({id:uid('a'),...d});na++});
if(sc)rowsOf(wb.Sheets[sc]).forEach(r=>{const company=txt(r,['azienda','cliente','ragionesociale','societa']);if(!company)return;
const an=txt(r,['agente','agentediprovenienza','provenienza']);let a=an?byName(an):null;
if(an&&!a){a={id:uid('a'),name:an,email:'',phone:'',zone:'',rate:0,status:'attivo'};next.agents.push(a);na++}
const st=norm(pick(r,['stato']));
next.clients.push({id:uid('c'),company,contact:txt(r,['referente','contatto']),email:txt(r,['email','mail']),phone:txt(r,['telefono','tel','cellulare']),agentId:a?a.id:'',date:isoD(pick(r,['data','dataacquisizione','acquisitoil'])),status:/trattativ/.test(st)?'trattativa':/perso/.test(st)?'perso':/attiv/.test(st)?'attivo':'lead',revenue:num(pick(r,['fatturato','importo'])),note:txt(r,['note','nota'])});nc++});
if(sp)rowsOf(wb.Sheets[sp]).forEach(r=>{const name=txt(r,['prodotto','nome','nomeprodotto','descrizione','articolo']);if(!name)return;
const code=txt(r,['codice','cod','sku','codicearticolo']);
const d={code,name,category:txt(r,['categoria','famiglia','gruppo']),um:txt(r,['um','unitadimisura','unita','udm'])||'pz',price:num(pick(r,['prezzo','prezzolistino','listino','importo'])),status:/non|inattiv|sospes/.test(norm(pick(r,['stato'])))?'inattivo':'attivo'};
const sc=pick(r,['sconti','scontiperquantita','scaglioni']);if(sc!=='')d.discounts=parseSc(sc);
const e=next.products.find(x=>code?norm(x.code)===norm(code):norm(x.name)===norm(name));
if(e)Object.assign(e,d);else next.products.push({id:uid('p'),discounts:[],...d});np++});
if(!na&&!nc&&!np){imsg('Nessuna riga importata: controlla che le intestazioni delle colonne siano quelle indicate sopra.');return}
next.clients.forEach(c=>{if(c.agentId&&!next.agents.some(x=>x.id===c.agentId))c.agentId=''});
S=next;save();render();imsg('Importazione completata: '+[nc&&nc+' clienti',na&&na+' agenti',np&&np+' prodotti'].filter(Boolean).join(', ')+' (nuovi o aggiornati).')
}catch(e){imsg('Impossibile leggere il file. Usa un file .xlsx, .xls o .csv.')}};
rd.readAsArrayBuffer(f)}

const eur2=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
const docTot=d=>d.lines.reduce((t,l)=>t+(+l.unit||0)*(+l.qty||0),0);
const clientRev=c=>(+c.revenue||0)+S.docs.filter(d=>d.type==='ordine'&&d.status!=='annullato'&&d.clientId===c.id).reduce((t,d)=>t+docTot(d),0);
const DS={preventivo:{bozza:'Bozza',inviato:'Inviato',accettato:'Accettato',rifiutato:'Rifiutato'},ordine:{confermato:'Confermato',evaso:'Evaso',annullato:'Annullato'}};

<div class="tw"><table><thead><tr><th>Numero</th><th>Tipo</th><th>Data</th><th>Cliente</th><th>Agente</th><th class="n">Totale</th><th>Stato</th></tr></thead><tbody id="rows">${docRows()}</tbody></table></div>`}

const prods=[...new Set(S.docs.flatMap(x=>x.lines.map(l=>l.product)))];

`<label>Tipo<select id="f_type" onchange="$('#f_status').innerHTML=stOpts(this.value)"><option value="preventivo" ${d.type==='preventivo'?'selected':''}>Preventivo</option><option value="ordine" ${d.type==='ordine'?'selected':''}>Ordine</option></select></label>`

dlg(id?'Scheda prodotto':'Nuovo prodotto',field('code','Codice',p.code)+field('um','Unità di misura',p.um)+field('name','Nome prodotto',p.name,{w:1})+field('category','Categoria',p.category)+field('price','Prezzo listino (€)',p.price,{t:'number'})+field('status','Stato',p.status,{opts:[['attivo','Attivo'],['inattivo','Non attivo']],w:1})
+`<div class="lines"><b>Sconti per quantità</b><p class="sub" style="margin:2px 0 8px">Ogni sconto scatta dalla quantità indicata: nei preventivi vale quello con la soglia più alta raggiunta. Si possono indicare sconti a cascata, ad esempio 10+5.</p><div id="dsc"></div><div class="bar"><button class="btn alt" onclick="PD.push({label:'',min:0,disc:''});rdn()">Aggiungi sconto</button></div></div><div class="mini" id="dmsg" hidden style="color:var(--bad)"></div>`,
(id?`<button class="btn del l" id="delb" onclick="delP('${id}')">Elimina prodotto</button>`:'')+'<button class="btn alt" onclick="closeDlg()">Annulla</button>'+`<button class="btn" onclick="saveP('${id||''}')">Salva prodotto</button>`);rdn()}
function saveP(id){const name=val('name');if(!name)return dm('Inserisci il nome del prodotto.');
const code=val('code');if(code&&S.products.some(x=>x.id!==id&&norm(x.code)===norm(code)))return dm('Esiste già un prodotto con questo codice.');
const d={code,name,category:val('category'),um:val('um')||'pz',price:Math.max(0,parseFloat(val('price'))||0),status:val('status'),discounts:PD.filter(x=>dfac(x.disc)<1).map(x=>({label:String(x.label||'').trim(),min:+x.min||0,disc:String(x.disc).replace(/\s/g,'').replace(/,/g,'.')})).sort((a,b)=>a.min-b.min)};
if(id)Object.assign(S.products.find(x=>x.id===id),d);else S.products.push({id:uid('p'),...d});save();closeDlg();render()}
function delP(id){const b=$('#delb');if(armed!==id){armed=id;b.textContent='Conferma eliminazione';return}S.products=S.products.filter(x=>x.id!==id);save();closeDlg();render()}

let R={a:'',c:'',from:'',to:''};
const RC={bozza:'#AEB9BD',inviato:'var(--warn)',accettato:'var(--ok)',rifiutato:'var(--bad)'};
const kfmt=n=>n>=1000?(n/1000).toLocaleString('it-IT',{maximumFractionDigits:1})+' k':String(Math.round(n));
function hbars(items){if(!items.length)return '<div class="empty">Nessun dato</div>';const mx=Math.max(1,...items.map(x=>x.v));
return items.map(x=>`<div class="rank"><span>${h(x.n)}${x.s?`<br><small>${h(x.s)}</small>`:''}</span><div class="track"><i style="width:${x.v/mx*100}%"></i></div><b>${eur(x.v)}</b></div>`).join('')}
function monthly(docs){
const ds=docs.filter(d=>d.date&&!(d.type==='ordine'&&d.status==='annullato'));
if(!ds.length)return '<div class="empty">Nessun dato per i filtri scelti.</div>';
const ms=ds.map(d=>d.date.slice(0,7)).sort();let [y,m]=ms[0].split('-').map(Number);const [y2,m2]=ms[ms.length-1].split('-').map(Number),keys=[];
while(y<y2||(y===y2&&m<=m2)){keys.push(y+'-'+String(m).padStart(2,'0'));if(++m>12){m=1;y++}}
const K=keys.slice(-18),sum=(k,t)=>ds.filter(d=>d.type===t&&d.date.startsWith(k)).reduce((a,d)=>a+docTot(d),0);
const o=K.map(k=>sum(k,'ordine')),q=K.map(k=>sum(k,'preventivo'));
const mx=Math.max(1,...o,...q),mag=10**Math.floor(Math.log10(mx)),top=[1,2,2.5,5,10].find(f=>f*mag>=mx)*mag;
const W=720,H=270,L0=46,B=34,T=12,pw=W-L0-8,ph=H-B-T,gw=pw/K.length,bw=Math.min(22,gw/2.6);
let g='';for(let i=0;i<=4;i++){const v=top/4*i,yy=T+ph-ph*v/top;g+=`<line x1="${L0}" x2="${W-8}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L0-6}" y="${yy+4}" text-anchor="end">${kfmt(v)}</text>`}
K.forEach((k,i)=>{const cx=L0+gw*i+gw/2,hq=ph*q[i]/top,ho=ph*o[i]/top,lab=new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString('it-IT',{month:'short'})+' '+k.slice(2,4);
g+=`<rect x="${cx-bw-1}" y="${T+ph-hq}" width="${bw}" height="${hq}" rx="2" style="fill:var(--acc2)"><title>Preventivi ${lab}: ${eur(q[i])}</title></rect><rect x="${cx+1}" y="${T+ph-ho}" width="${bw}" height="${ho}" rx="2" style="fill:var(--acc)"><title>Ordini ${lab}: ${eur(o[i])}</title></rect><text x="${cx}" y="${H-12}" text-anchor="middle">${lab}</text>`});
return `<div class="lg"><span><i style="background:var(--acc2)"></i>Preventivi</span><span><i style="background:var(--acc)"></i>Ordini</span></div><svg class="cht" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento mensile di preventivi e ordini">${g}</svg>`}
function qstat(qs){if(!qs.length)return '<div class="empty">Nessun preventivo</div>';
const ks=Object.keys(DS.preventivo),c=Object.fromEntries(ks.map(k=>[k,qs.filter(d=>d.status===k).length]));
return `<div class="stk">${ks.filter(k=>c[k]).map(k=>`<i style="width:${c[k]/qs.length*100}%;background:${RC[k]}"></i>`).join('')}</div><div class="lg">${ks.map(k=>`<span><i style="background:${RC[k]}"></i>${DS.preventivo[k]}: <b>${c[k]}</b></span>`).join('')}</div>`}
function repBody(){
const docs=S.docs.filter(d=>(!R.a||d.agentId===R.a)&&(!R.c||d.clientId===R.c)&&(!R.from||d.date>=R.from)&&(!R.to||d.date<=R.to));
const ords=docs.filter(d=>d.type==='ordine'&&d.status!=='annullato'),qs=docs.filter(d=>d.type==='preventivo');
const to=ords.reduce((t,d)=>t+docTot(d),0),tq=qs.reduce((t,d)=>t+docTot(d),0);
const dec=qs.filter(d=>d.status!=='bozza'),acc=qs.filter(d=>d.status==='accettato');
const com=ords.reduce((t,d)=>t+docTot(d)*((ag(d.agentId)||{}).rate||0)/100,0);
const top=(m,sub)=>Object.entries(m).map(([k,v])=>({k,v:v.v,n:v.n,s:v.s})).sort((a,b)=>b.v-a.v).slice(0,8);
const byA={},byC={},byP={};
ords.forEach(d=>{const t=docTot(d);const a=byA[d.agentId]=byA[d.agentId]||{v:0,c:0,n:(ag(d.agentId)||{}).name||'Senza agente'};a.v+=t;a.c++;
const cl=S.clients.find(x=>x.id===d.clientId),c=byC[d.clientId]=byC[d.clientId]||{v:0,c:0,n:cl?cl.company:'Cliente eliminato'};c.v+=t;c.c++;
d.lines.forEach(l=>{const p=byP[l.product]=byP[l.product]||{v:0,q:0,n:l.product};p.v+=l.unit*l.qty;p.q+=l.qty})});
const lst=(m,f)=>Object.values(m).sort((a,b)=>b.v-a.v).slice(0,8).map(x=>({n:x.n,v:x.v,s:f(x)}));
return `<div class="strip"><div><b>${eur(to)}</b><span>ordini (${ords.length})</span></div><div><b>${eur(tq)}</b><span>preventivi (${qs.length})</span></div>
<div><b>${dec.length?Math.round(acc.length/dec.length*100)+'%':'–'}</b><span>preventivi accettati sui valutati</span></div>
<div><b>${eur(ords.length?to/ords.length:0)}</b><span>valore medio ordine</span></div><div><b>${eur(com)}</b><span>provvigioni sugli ordini</span></div></div>
<section class="box"><h3>Andamento mensile</h3><div class="sc">${monthly(docs)}</div></section>
<div class="rg"><section class="box"><h3>Ordini per agente</h3>${hbars(lst(byA,x=>x.c+' ordini'))}</section>
<section class="box"><h3>Ordini per cliente</h3>${hbars(lst(byC,x=>x.c+' ordini'))}</section>
<section class="box"><h3>Prodotti più venduti</h3>${hbars(lst(byP,x=>'quantità '+x.q))}</section>
<section class="box"><h3>Stato dei preventivi</h3>${qstat(qs)}</section></div>
<p class="sub">Il report considera i preventivi e gli ordini registrati nella sezione Preventivi e ordini; gli ordini annullati sono esclusi. Il fatturato storico inserito nelle schede cliente non è incluso, perché non ha una data.</p>`}
function repUp(){$('#rep').innerHTML=repBody()}
function reportV(){
const cl=[...S.clients].sort((a,b)=>a.company.localeCompare(b.company));
return `<h2>Report</h2><div class="bar"><select aria-label="Filtra per agente" onchange="R.a=this.value;repUp()"><option value="">Tutti gli agenti</option>${S.agents.map(a=>`<option value="${a.id}" ${R.a===a.id?'selected':''}>${h(a.name)}</option>`).join('')}</select>
<select aria-label="Filtra per cliente" onchange="R.c=this.value;repUp()"><option value="">Tutti i clienti</option>${cl.map(c=>`<option value="${c.id}" ${R.c===c.id?'selected':''}>${h(c.company)}</option>`).join('')}</select>
<label class="sub">Dal <input type="date" value="${R.from}" onchange="R.from=this.value;repUp()"></label><label class="sub">Al <input type="date" value="${R.to}" onchange="R.to=this.value;repUp()"></label>
<button class="btn alt" onclick="R={a:'',c:'',from:'',to:''};render()">Azzera filtri</button></div><div id="rep">${repBody()}</div>`}

let FU=7,NO=null;try{FU=parseInt(localStorage.getItem('rv-fu'))||7}catch(e){}
const ageOf=d=>Math.max(0,Math.floor((new Date(today())-new Date(d.fu&&d.fu>d.date?d.fu:d.date))/864e5));
function pend(){const list=S.docs.filter(d=>d.type==='preventivo'&&(d.status==='bozza'||d.status==='inviato')).map(d=>({d,age:ageOf(d)})).sort((a,b)=>b.age-a.age);
return{list,late:list.filter(x=>x.age>=FU).length}}
function notifV(){const {list,late}=pend();
const open=NO===null?late>0:NO,cls=late?'late':list.length?'wait':'ok';
const txt=!list.length?'Nessun preventivo in attesa di risposta: tutto in ordine.':(late?`<b>${late}</b> ${late===1?'preventivo da sollecitare':'preventivi da sollecitare'}`:'Nessun preventivo da sollecitare')+` · ${list.length} in attesa di risposta`;
const ic='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
const rows=list.map(({d,age})=>{const c=S.clients.find(x=>x.id===d.clientId),a=ag(d.agentId);
return `<tr class="${age>=FU?'lt':''}"><td>${h(d.num)}<br><span class="sub">${DS.preventivo[d.status]}</span></td><td>${h(c?c.company:'–')}<br><span class="sub">${h(a?a.name:'–')}</span></td><td class="n">${eur2(docTot(d))}</td><td>${age===0?'oggi':age===1?'1 giorno':age+' giorni'}${age>=FU?' · <b>da sollecitare</b>':''}${d.fu?`<br><span class="sub">ultimo follow-up ${dt(d.fu)}</span>`:''}</td><td class="act"><button class="btn alt sm" onclick="openD('${d.id}')">Apri</button><button class="btn alt sm" onclick="fuDone('${d.id}')">Follow-up fatto</button><button class="btn sm" onclick="accD('${d.id}')">Accettato</button><button class="btn del sm" onclick="rifD('${d.id}')">Rifiutato</button></td></tr>`}).join('');
return `<div class="nt ${cls}" role="region" aria-label="Notifiche"><div class="nth">${ic}<span class="ntt" role="status">${txt}</span>
<label>Segnala dopo<select aria-label="Giorni prima di segnalare un preventivo" onchange="setFU(this.value)">${[3,7,14,30].map(n=>`<option value="${n}" ${n===FU?'selected':''}>${n} giorni</option>`).join('')}</select></label>
${list.length?`<button class="btn alt sm" aria-expanded="${open}" onclick="NO=${!open};render()">${open?'Nascondi elenco':'Mostra elenco'}</button>`:''}</div>
${open&&list.length?`<div class="ntb"><table><thead><tr><th>Preventivo</th><th>Cliente e agente</th><th class="n">Importo</th><th>In attesa da</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:''}</div>`}
function setFU(v){FU=parseInt(v)||7;try{localStorage.setItem('rv-fu',String(FU))}catch(e){}render()}
function fuDone(id){S.docs.find(x=>x.id===id).fu=today();save();render()}
function accD(id){const d=S.docs.find(x=>x.id===id);d.status='accettato';save();render();openD(id)}
function rifD(id){S.docs.find(x=>x.id===id).status='rifiutato';save();render()}
render();
</script>
</body>
</html>
